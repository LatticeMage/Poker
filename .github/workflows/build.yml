name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the site in Docker
        run: |
          docker build \
            --build-arg BASE_PATH=/${{ github.event.repository.name }} \
            -t poker-site .
          # Take the finished site out of the image.
          docker create --name site poker-site
          docker cp site:/app/build ./site
          docker rm site
          # Single-page app: unknown paths fall back to the app.
          cp site/index.html site/404.html
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
